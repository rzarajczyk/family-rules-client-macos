name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Get version
        id: version
        run: |
          VERSION=$(xcodebuild -project FamilyRulesClient.xcodeproj \
            -scheme FamilyRulesAgent \
            -showBuildSettings 2>/dev/null \
            | grep MARKETING_VERSION | head -1 | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and archive
        run: |
          xcodebuild archive \
            -project FamilyRulesClient.xcodeproj \
            -scheme FamilyRulesAgent \
            -configuration Release \
            -archivePath $RUNNER_TEMP/FamilyRulesAgent.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Copy app from archive
        run: |
          APP_PATH=$(find $RUNNER_TEMP/FamilyRulesAgent.xcarchive -name "*.app" | head -1)
          cp -R "$APP_PATH" $RUNNER_TEMP/FamilyRulesAgent.app
          echo "APP_PATH=$RUNNER_TEMP/FamilyRulesAgent.app" >> $GITHUB_ENV

      - name: Create DMG installer
        run: |
          DMG_PATH=$RUNNER_TEMP/FamilyRulesAgent-${{ steps.version.outputs.tag }}.dmg
          hdiutil create -volname "FamilyRulesAgent" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FamilyRulesAgent ${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## FamilyRulesAgent ${{ steps.version.outputs.version }}

            Built from commit ${{ github.sha }}

            > **Note:** This build is unsigned. macOS will show a security warning on first launch.
            > To open it: right-click the app and choose **Open**, then click **Open** in the dialog.
          draft: false
          prerelease: false
          files: ${{ env.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
